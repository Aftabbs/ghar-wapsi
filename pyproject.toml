[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghar-wapsi-pipeline"
version = "0.1.0"
description = "Data pipeline for Ghar Wapsi: India's festival homecoming, animated"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["shapely>=2.0", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
package-dir = { "" = "pipeline" }
packages = ["ghar"]

[tool.pytest.ini_options]
pythonpath = ["pipeline"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["ghar"]
